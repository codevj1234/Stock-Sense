services:
  db:
    image: postgres:16-alpine
    container_name: stocksense-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense123
      POSTGRES_DB: stocksense
    volumes:
      # Auto-run schema on first start (Postgres runs .sql in /docker-entrypoint-initdb.d alphabetically)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
